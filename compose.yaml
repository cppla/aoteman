name: aoteman

services:
  web:
    image: aoteman:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8787}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
